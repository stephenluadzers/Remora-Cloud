services:
  - type: web
    name: remora-cloud
    runtime: node
    rootDir: remora-cloud
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: remora-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: REMORA_CLOUD_TOKEN
        generateValue: true
    autoDeploy: true
